# 每次推送网页或安卓工程的改动，自动打包安卓安装包（APK），
# 并发布到 GitHub Releases 的「最新版安卓安装包」，下载链接固定不变：
# https://github.com/shizhongzhou/xiangao-diary/releases/latest/download/xiangao-diary.apk
name: 打包安卓 APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - '*.png'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 24.04 构建机自带安卓 SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查安卓 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 把网页版放进 App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json favicon.png icon-192.png icon-512.png apple-touch-icon.png android/app/src/main/assets/

      - name: 打包 APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: 整理文件
        run: cp android/app/build/outputs/apk/release/app-release.apk xiangao-diary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xiangao-diary-apk
          path: xiangao-diary.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" xiangao-diary.apk \
            --title "线稿日记 安卓版 1.0.${{ github.run_number }}" \
            --notes "在安卓手机上下载 xiangao-diary.apk，点开安装即可（第一次需要允许「安装未知来源应用」）。新版本可以直接覆盖安装，记录不会丢。" \
            --latest
