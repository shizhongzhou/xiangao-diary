<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>线稿日记</title>
<meta name="description" content="拍照生成线稿，写下感受，点格子涂色。">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="线稿日记">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
img { max-width: 100%; }
#app { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<style>
/* 布局：一屏手机 App —— 顶部标题、中间内容滚动、底部固定四个标签。纸白底、墨黑粗描边、彩色色块 */
:root {
  --paper: #FBFAF7;
  --ink: #141414;
  --ink-soft: #3A3A3A;
  --muted: #6B6B6B;
  --line: #E4E2DC;
  --soft: #EFEDE7;
  --white: #FFFFFF;
  --accent: #FF5B3A;
  --dark: #0E0E0E;
  --dark-soft: #1F1F1F;
  --tint-orange: #FFE4D9;
  --tint-green: #DDF0D3;
  --tint-blue: #DCEFF7;
  --danger: #C2361B;
  --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --tab-h: 64px;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
#view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 底部标签栏 */
#tabs {
  flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line); background: var(--paper);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
#tabs button {
  border: 0; background: none; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11px; font-weight: 600;
}
#tabs button[aria-current="page"] { color: var(--ink); font-weight: 800; }
#tabs.dark { background: var(--dark); border-top-color: #262626; }
#tabs.dark button { color: #8A8A8A; }
#tabs.dark button[aria-current="page"] { color: var(--white); }

svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 18px; height: 18px; stroke-width: 2; }

/* 通用部件 */
.h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.5px; }
.sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.head { padding-block: 14px 4px; }
.bar { display: flex; align-items: center; gap: 4px; padding-block: 8px; }
.bar .title { flex: 1 1 auto; min-width: 0; text-align: center; font-size: 17px; font-weight: 800; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0;
}
.icon-btn:disabled { opacity: .3; }
.btn {
  min-height: 52px; border-radius: 16px; border: 2px solid var(--ink); background: var(--ink); color: var(--white);
  font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px;
}
.btn.outline { background: transparent; color: var(--ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .4; }
.row-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border-radius: 999px; background: var(--soft); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 0 16px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 800; box-shadow: 0 1px 2px rgba(20,20,20,.12); }
.seg.dark { background: var(--dark-soft); }
.seg.dark button { color: #BDBDBD; }
.seg.dark button[aria-pressed="true"] { background: var(--white); color: var(--dark); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--soft); font-size: 13px; font-weight: 600; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; border: 1.5px solid transparent; }
.badge.todo { border-color: var(--ink); }
.badge.doing { background: var(--tint-orange); }
.badge.done { background: var(--tint-green); }
.progress { width: 72px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.progress > i { display: block; height: 100%; background: var(--ink); }
label.field { display: block; font-size: 14px; font-weight: 800; margin: 18px 0 8px; }
textarea {
  width: 100%; min-height: 108px; resize: none; padding: 14px 16px; border-radius: 16px; border: 1.5px solid #D6D3CB; background: var(--white);
  font-size: 16px; line-height: 1.6;
}
textarea::placeholder { color: var(--muted); }
.counter { text-align: right; font-size: 12px; color: var(--muted); margin-top: 6px; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px; text-align: center; color: var(--muted); line-height: 1.6; }
.empty svg.i { width: 40px; height: 40px; }

/* 拍照页（深色） */
.cam { flex: 1; display: flex; flex-direction: column; background: var(--dark); color: var(--white); }
.cam .top { display: flex; align-items: center; justify-content: center; padding-block: 12px; min-height: 68px; }
.cam-title { font-size: 17px; font-weight: 800; letter-spacing: .5px; color: var(--white); }
.viewfinder { flex: 1 1 auto; min-height: 0; margin: 0 12px; border-radius: 28px; background: var(--white); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--dark); }
.viewfinder video.mirror { transform: scaleX(-1); }
.cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; color: var(--ink); line-height: 1.6; }
.cam-msg b { font-size: 18px; }
.cam-msg span { color: var(--muted); font-size: 14px; }
.cam-msg .btn { min-width: 180px; }
.shutter { background: transparent; padding: 0; }
.shutter:disabled { opacity: .4; }
.vf-badge { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--dark); font-size: 12px; font-weight: 600; color: var(--white); }
.vf-badge::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
.cam .hint { text-align: center; color: #A3A3A3; font-size: 13px; margin: 14px 0 0; }
.cam .controls { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px 18px; }
.round { width: 54px; height: 54px; border-radius: 27px; background: var(--dark-soft); color: var(--white); display: inline-flex; align-items: center; justify-content: center; }
.shutter { width: 82px; height: 82px; border-radius: 41px; border: 4px solid var(--white); display: inline-flex; align-items: center; justify-content: center; }
.shutter::after { content: ""; width: 64px; height: 64px; border-radius: 32px; background: var(--white); transition: transform .12s; }
.shutter:active::after { transform: scale(.9); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 生成结果 */
.result-card { height: min(52vh, 380px); border-radius: 24px; border: 2px solid var(--ink); background: var(--white); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.result-card canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
.busy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.88); font-weight: 700; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.gen-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
.gen-note { margin: 10px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); text-align: center; }
.key-row { display: flex; gap: 8px; }
.key-row input, .text-in {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #D6D3CB;
  background: var(--white); font-size: 16px; font-family: ui-monospace, Menlo, monospace;
}
.footer { border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); }

/* 上色编辑器 */
.stage { flex: 1 1 auto; min-height: 0; position: relative; background: var(--white); border-block: 1px solid var(--line); overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.stage .tip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.zoom-btn { position: absolute; left: 12px; bottom: 12px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--white); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
.done-btn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--ink); color: var(--white); font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
.palette-sheet { padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cur { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
.cur i { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--ink); display: block; }
.swatches { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.swatches button { height: 42px; border-radius: 12px; border: 1px solid rgba(20,20,20,.12); padding: 0; }
.swatches button[aria-pressed="true"] { border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--white); }
.eraser { min-height: 42px; border-radius: 12px; border: 1.5px solid var(--ink); background: transparent; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.eraser[aria-pressed="true"] { background: var(--ink); color: var(--white); }

/* 列表 */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-block: 16px; }
.tile { border: 1.5px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--white); padding: 0; text-align: left; display: flex; flex-direction: column; }
.tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-bottom: 1.5px solid var(--ink); background: var(--white); }
.tile .meta { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.tile .d { font-size: 13px; font-weight: 800; }
.tile .p { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.tabs2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: var(--soft); margin-top: 14px; }
.tabs2 button { border: 0; background: transparent; min-height: 40px; border-radius: 10px; color: var(--muted); font-weight: 600; }
.tabs2 button[aria-selected="true"] { background: var(--white); color: var(--ink); font-weight: 800; }
.list { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 24px; }
.card { display: flex; gap: 14px; padding: 12px; border-radius: 20px; border: 1.5px solid var(--ink); background: var(--white); text-align: left; width: 100%; }
.card img { width: 104px; height: 124px; object-fit: cover; border-radius: 12px; border: 1.5px solid var(--ink); flex: none; background: var(--white); }
.card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card .date { font-size: 12px; color: var(--muted); }
.card .note { font-size: 14px; line-height: 1.5; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.card .note.none { color: var(--muted); }
.card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .go { font-size: 13px; font-weight: 800; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.cal-head h2 { margin: 0; font-size: 17px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week span { text-align: center; font-size: 12px; color: var(--muted); padding-block: 6px; }
.day { height: 46px; border-radius: 12px; border: 0; background: transparent; position: relative; overflow: hidden; padding: 0; font-size: 14px; color: var(--ink-soft); }
.day.has { border: 1.5px solid var(--ink); }
.day.has img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.day b { position: relative; font-weight: 600; }
.day.has b { background: rgba(255,255,255,.88); padding: 0 4px; border-radius: 6px; font-weight: 900; color: var(--ink); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.sel { box-shadow: inset 0 0 0 2.5px var(--ink); }

/* 详情 */
.detail-img { width: 100%; max-height: 56vh; object-fit: contain; border-radius: 20px; border: 2px solid var(--ink); background: var(--white); display: block; }
.stack { display: flex; flex-direction: column; gap: 12px; padding-block: 8px 28px; }

/* 账户 */
.profile { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; border: 1.5px solid var(--ink); background: var(--white); }
.avatar { width: 64px; height: 64px; border-radius: 32px; border: 2px solid var(--ink); background: #FFD966; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; flex: none; }
.profile input { border: 0; background: transparent; font-size: 18px; font-weight: 800; width: 100%; padding: 4px 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats div { padding: 14px 12px; border-radius: 16px; }
.stats b { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--ink-soft); }
.group-title { margin: 18px 4px 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
.group { border-radius: 18px; background: var(--white); border: 1px solid var(--line); overflow: hidden; }
.group .item { padding: 14px 16px; border-bottom: 1px solid var(--soft); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.group .item:last-child { border-bottom: 0; }
.group .item.inline { flex-direction: row; align-items: center; justify-content: space-between; min-height: 56px; }
.item small { color: var(--muted); font-size: 12px; margin-top: -6px; }
.link-danger { border: 0; background: none; color: var(--danger); font-size: 15px; padding: 0; min-height: 28px; }

/* 底部弹层 */
#overlay { position: fixed; inset: 0; background: rgba(14,14,14,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
#overlay .panel {
  width: 100%; max-width: 560px; background: var(--paper); border-radius: 24px 24px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto;
}
#overlay h2 { margin: 0; font-size: 18px; }
#overlay p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
#overlay .save-img { width: 100%; border-radius: 16px; border: 2px solid var(--ink); background: var(--white); -webkit-touch-callout: default; }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 60; white-space: nowrap; }
</style>

<div id="app">
  <div id="view"></div>
  <nav id="tabs" aria-label="主导航"></nav>
</div>
<div id="overlay" hidden></div>
<div id="toast" role="status" hidden></div>
<input id="albumInput" class="vh" type="file" accept="image/*" aria-label="从相册选择照片">

<script>
/**
 * 照片 → 涂色本线稿，以及线稿 → 可填色的格子。
 * 纯 TypeScript，不依赖任何原生模块，所有运算都在手机本地完成。
 *
 * 思路：先把照片简化成几块颜色均匀的色块（像动画上色前的分色稿），
 * 每条线都画在两个色块的分界上，所以每个格子天然是封闭的，填色不会漏到别的格子。
 * 线条再做平滑和抗锯齿，得到粗细均匀、圆润的涂色本线条。
 */
/** 线稿参数（粗细结合的一种风格） */
const PARAMS = {
    colors: 9, // 分色数量：越多格子越多、细节越多
    minCell: 1 / 1100, // 最小格子占全图的比例：越大画面越简洁
    smooth: 3, // 边界平滑次数：越多线条越圆润
    thinRadius: 0.7, // 细线半径（像素）
    boldRadius: 2.6, // 粗线半径（像素）
    boldFrom: 10, // 两侧颜色反差（Lab 色差）大于这个值开始变粗
    boldFull: 40, // 反差达到这个值时是最粗的线
    detail: 10, // 细节线灵敏度：越小细节越多（五官、发丝）
};
/** 输出线稿的最长边（像素） */
const WORK_SIZE = 960;
/** 分色计算时的最长边：小一些，画面更简洁、也更快 */
const SEG_SIZE = 440;
// ---------- 基础工具 ----------
function gaussianBlur(src, w, h, sigma) {
    const r = Math.max(1, Math.ceil(sigma * 2.5));
    const k = new Float32Array(2 * r + 1);
    let sum = 0;
    for (let i = -r; i <= r; i++) {
        const v = Math.exp(-(i * i) / (2 * sigma * sigma));
        k[i + r] = v;
        sum += v;
    }
    for (let i = 0; i < k.length; i++)
        k[i] /= sum;
    const tmp = new Float32Array(w * h);
    const out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
            let acc = 0;
            for (let i = -r; i <= r; i++) {
                let xx = x + i;
                if (xx < 0)
                    xx = 0;
                else if (xx >= w)
                    xx = w - 1;
                acc += src[row + xx] * k[i + r];
            }
            tmp[row + x] = acc;
        }
    }
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            let acc = 0;
            for (let i = -r; i <= r; i++) {
                let yy = y + i;
                if (yy < 0)
                    yy = 0;
                else if (yy >= h)
                    yy = h - 1;
                acc += tmp[yy * w + x] * k[i + r];
            }
            out[y * w + x] = acc;
        }
    }
    return out;
}
/** 正方形 + 十字交替膨胀，近似圆形笔刷。 */
function dilate(mask, w, h, radius) {
    let cur = mask;
    for (let it = 0; it < radius; it++) {
        const square = it % 2 === 1;
        const next = new Uint8Array(cur);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = y * w + x;
                if (cur[i])
                    continue;
                let hit = (x > 0 && cur[i - 1]) || (x < w - 1 && cur[i + 1]) || (y > 0 && cur[i - w]) || (y < h - 1 && cur[i + w]);
                if (!hit && square) {
                    hit = (x > 0 && y > 0 && cur[i - w - 1]) || (x < w - 1 && y > 0 && cur[i - w + 1]) ||
                        (x > 0 && y < h - 1 && cur[i + w - 1]) || (x < w - 1 && y < h - 1 && cur[i + w + 1]);
                }
                if (hit)
                    next[i] = 1;
            }
        }
        cur = next;
    }

// ---------------- 存储（IndexedDB，只在这台设备的浏览器里） ----------------
const Store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('xiangao-diary', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('records', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async all() {
    if (!this.db) return [];
    return new Promise((res) => {
      try {
        const q = this.db.transaction('records').objectStore('records').getAll();
        q.onsuccess = () => res(q.result || []);
        q.onerror = () => res([]);
      } catch (e) { res([]); }
    });
  },
  put(rec) {
    if (!this.db) return;
    try {
      const { previewUrl, ...plain } = rec;
      this.db.transaction('records', 'readwrite').objectStore('records').put(plain);
    } catch (e) { /* 存不了就只留在内存里 */ }
  },
  del(id) {
    if (!this.db) return;
    try { this.db.transaction('records', 'readwrite').objectStore('records').delete(id); } catch (e) { /* 忽略 */ }
  },
};

// ---------------- 图像工具 ----------------
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const toBlob = (c) => new Promise((res) => c.toBlob((b) => res(b), 'image/png'));
function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('这张图片打不开，换一张试试'));
    img.src = src;
  });
}
async function pixelsFromSource(src, maxSide) {
  const img = await loadImg(src);
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const s = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * s)), h = Math.max(1, Math.round(sh * s));
  const c = canvasOf(w, h);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return { w, h, rgba: new Uint8Array(ctx.getImageData(0, 0, w, h).data.buffer) };
}
function rgbaCanvas(rgba, w, h) {
  const c = canvasOf(w, h);
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.length), w, h), 0, 0);
  return c;
}
// 线稿 PNG（黑线白底，带抗锯齿）→ 线条浓度和遮罩
async function lineFromBlob(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const { w, h, rgba } = await pixelsFromSource(url, 100000);
    return { w, h, ...rgbaToLine(rgba, w * h) };
  } finally { URL.revokeObjectURL(url); }
}

const state = { tab: 'camera', view: 'camera', params: {} };
const TABS = [['camera', '拍照', 'camera'], ['color', '上色', 'palette'], ['history', '历史', 'book'], ['account', '账户', 'user']];
let cleanup = null;

function go(view, params = {}) {
  if (cleanup) { const c = cleanup; cleanup = null; c(); }
  state.view = view;
  state.params = params;
  if (TABS.some((t) => t[0] === view)) state.tab = view;
  render();
}

    `<button type="button" data-tab="${id}" ${state.view === id ? 'aria-current="page"' : ''}>${icon(ic)}${label}</button>`).join('');
}

function render() {
  renderTabs();
  const v = $('#view');
  const views = { camera: viewCamera, result: viewResult, editor: viewEditor, color: viewColor, history: viewHistory, record: viewRecord, account: viewAccount };

// ---------------- 拍照（App 内置取景框，不调用系统相机，不会自动开闪光灯） ----------------
function viewCamera(v) {
  let facing = Settings.data.facing === 'user' ? 'user' : 'environment';
  let stream = null, alive = true, shooting = false;
  v.innerHTML = `
    <div class="cam">
      <div class="top pad"><span class="cam-title">线稿日记</span></div>
      <div class="viewfinder" id="vf">
        <video id="vid" playsinline muted autoplay></video>
        <div class="cam-msg" id="camMsg" hidden></div>
        <span class="vf-badge">拍完自动生成线稿</span>
      </div>
      <p class="hint" id="camHint">对准想记录的瞬间，按下快门</p>
      <div class="controls">
        <label class="round" for="albumInput" aria-label="从相册选择">${icon('image')}</label>
        <button type="button" class="shutter" id="shutter" aria-label="拍照" disabled></button>
        <button type="button" class="round" id="flip" aria-label="切换前后摄像头" style="border:0">${icon('flip')}</button>
      </div>
    </div>`;
  const video = $('#vid', v), msg = $('#camMsg', v), shutter = $('#shutter', v);

  const stop = () => { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } };
  const showMsg = (html) => {
    msg.innerHTML = html;
    msg.hidden = false;
    video.hidden = true;
    shutter.disabled = true;
  };
  const start = async () => {
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg(`<b>这个浏览器打不开相机</b><span>可以从相册选一张照片。</span><label class="btn" for="albumInput">从相册选择</label>`);
      return;
    }
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } },
      });
      if (!alive) { s.getTracks().forEach((t) => t.stop()); return; }
      stream = s;
      video.srcObject = s;
      video.classList.toggle('mirror', facing === 'user');
      video.hidden = false;
      msg.hidden = true;
      await video.play().catch(() => {});
      shutter.disabled = false;
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      showMsg(denied
        ? `<b>没有相机权限</b><span>在 iPhone「设置 › Safari › 相机」里选择「允许」，然后回来刷新页面。也可以先从相册选一张照片。</span><button type="button" class="btn" id="camRetry">重试</button><label class="btn outline" for="albumInput">从相册选择</label>`
        : `<b>相机打不开</b><span>可能被别的 App 占用了。可以重试，或者从相册选一张照片。</span><button type="button" class="btn" id="camRetry">重试</button><label class="btn outline" for="albumInput">从相册选择</label>`);
      const r = $('#camRetry', v);
      if (r) r.addEventListener('click', start);
    }
  };

  // 拍下取景框里看到的画面（前置摄像头和预览一样是镜像，所见即所得）
  const shoot = async () => {
    if (!stream || shooting || !video.videoWidth) return;
    shooting = true;
    const vw = video.videoWidth, vh = video.videoHeight;
    const box = $('#vf', v).getBoundingClientRect();
    const ar = box.width / box.height;
    let cw = vw, ch = vh;
    if (vw / vh > ar) cw = Math.round(vh * ar); else ch = Math.round(vw / ar);
    const sx = (vw - cw) / 2, sy = (vh - ch) / 2;
    const c = canvasOf(cw, ch);
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(cw, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);
    const blob = await new Promise((res) => c.toBlob((b) => res(b), 'image/jpeg', 0.92));
    shooting = false;
    if (blob) go('result', { file: blob });
  };

  shutter.addEventListener('click', shoot);
  $('#flip', v).addEventListener('click', () => {
    facing = facing === 'user' ? 'environment' : 'user';
    Settings.set({ facing });
    start();
  });
  const onVis = () => { if (document.hidden) stop(); else if (alive) start(); };
  document.addEventListener('visibilitychange', onVis);
  cleanup = () => { alive = false; stop(); document.removeEventListener('visibilitychange', onVis); };
  start();
}

function onPicked(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  go('result', { file: f });
}
$('#albumInput').addEventListener('change', onPicked);

function viewResult(v) {
  const p = state.params;
  const created = Date.now();
  let src = null, line = null, busy = true;
  v.innerHTML = `
    <div class="bar pad">
      <button type="button" class="icon-btn" data-back aria-label="重拍">${icon('back')}</button>
      <h1 class="title">新的记录</h1>
      <span style="width:44px"></span>
    </div>
    <div class="scroll pad">
      <div class="result-card"><canvas id="rc"></canvas><div class="busy" id="busy"><div class="spinner"></div>正在画线稿…</div></div>
      <p class="gen-note">外轮廓粗线、细节细线，每个格子都是封闭的，涂色只会填满点中的那一格。</p>
      <div style="margin-top:14px"><span class="chip">${icon('cal', 'sm')}${fmtDate(created)} ${fmtTime(created)}</span></div>
      <label class="field" for="noteInput">此刻的感受</label>
      <textarea id="noteInput" maxlength="200" placeholder="写点什么吧：今天看到了什么、想到了什么……"></textarea>
      <div class="counter" id="cnt">0 / 200</div>
      <div style="height:16px"></div>
    </div>
    <div class="footer pad">
      <div class="row-btns">
        <button type="button" class="btn outline" id="saveOnly" disabled>存入历史</button>
        <button type="button" class="btn" id="saveColor" disabled>开始上色 ${icon('arrow', 'sm')}</button>
      </div>
    </div>`;
  const canvas = $('#rc', v);
  const setBusy = (b) => {
    busy = b;
    $('#busy', v).hidden = !b;
    $('#saveOnly', v).disabled = b;
    $('#saveColor', v).disabled = b;
  };
  const generate = async () => {
    setBusy(true);
    await wait(40);
    try {
      if (!src) {
        const url = URL.createObjectURL(p.file);
        try { src = await pixelsFromSource(url, Settings.data.quality === 'high' ? 1280 : WORK_SIZE); }
        finally { URL.revokeObjectURL(url); }
      }
      line = makeLineArt(src.rgba, src.w, src.h);
      canvas.width = src.w; canvas.height = src.h;
      canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(alphaToRgba(line.alpha).buffer), src.w, src.h), 0, 0);
    } catch (e) {
      toast(e.message || '生成失败');
    } finally { setBusy(false); }
  };
  const note = $('#noteInput', v);
  note.addEventListener('input', () => { $('#cnt', v).textContent = `${note.value.length} / 200`; });
  $('[data-back]', v).addEventListener('click', () => go('camera'));
  const save = async (thenColor) => {
    if (!line) return;
    setBusy(true);
    const blob = await toBlob(rgbaCanvas(alphaToRgba(line.alpha), src.w, src.h));
    const rec = withUrl({ id: Date.now().toString(36), createdAt: created, note: note.value.trim(), style: 'mixed', w: src.w, h: src.h, colors: {}, progress: 0, line: blob, preview: blob });
    records.unshift(rec);
    Store.put(rec);
    if (thenColor) go('editor', { id: rec.id, from: 'history' });
    else { go('history'); toast('已存入历史'); }
  };
  $('#saveOnly', v).addEventListener('click', () => save(false));
  $('#saveColor', v).addEventListener('click', () => save(true));
  if (p.file) generate(); else go('camera');
}

    $('#curName', v).textContent = current === ERASER ? '橡皮擦' : (PALETTE.find((p) => p[1] === current) || [''])[0];
  };
  const updateProgress = () => {
    const p = data ? coloredRatio(data.regions, colors) : rec.progress;
    $('#prog', v).style.width = `${Math.round(p * 100)}%`;
    $('#progT', v).textContent = `已涂 ${Math.round(p * 100)}%`;
    $('#eUndo', v).disabled = !undoStack.length;
    $('#eRedo', v).disabled = !redoStack.length;
  };
  const geom = () => {
    const fit = Math.min(box.w / data.w, box.h / data.h);
    return { fit, ox: (box.w - data.w * fit) / 2, oy: (box.h - data.h * fit) / 2, cw: data.w * fit, ch: data.h * fit };
  };
  const draw = () => {
    if (!data || !box.w) return;
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, box.w, box.h);
    const g = geom();
    ctx.imageSmoothingEnabled = view.scale * g.fit < 1.5;
    ctx.drawImage(off, g.ox + view.tx, g.oy + view.ty, g.cw * view.scale, g.ch * view.scale);
    $('#zoomBtn span', v).textContent = view.scale > 1.01 ? `${Math.round(view.scale * 100)}% · 复原` : '100%';
  };
  const resize = () => {
    const r = stage.getBoundingClientRect();
    box = { w: r.width, h: r.height };
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    draw();
  };
  const recompose = () => {
    off.width = data.w; off.height = data.h;
    const rgba = compose(data.alpha, data.regions, colors, data.w, data.h);
    off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer), data.w, data.h), 0, 0);
    draw();
    updateProgress();
  };
  const setRegion = (label, color) => {
    colors = { ...colors };
    if (color) colors[label] = color; else delete colors[label];
    dirty = true;
    recompose();
  };
  const clamp = (s) => {
    const g = geom();
    const scale = Math.min(MAX, Math.max(1, s.scale));
    const cx = (g.cw * (1 - scale)) / 2, cy = (g.ch * (1 - scale)) / 2;
    const lx = (g.cw * (scale - 1)) / 2 + box.w * 0.25, ly = (g.ch * (scale - 1)) / 2 + box.h * 0.25;
    return { scale, tx: Math.min(cx + lx, Math.max(cx - lx, s.tx)), ty: Math.min(cy + ly, Math.max(cy - ly, s.ty)) };
  };
  const paintAt = (sx, sy) => {
    if (!data) return;
    const g = geom();
    const s = g.fit * view.scale;
    const x = (sx - g.ox - view.tx) / s, y = (sy - g.oy - view.ty) / s;
    if (x < 0 || y < 0 || x >= data.w || y >= data.h) return;
    const label = regionAt(data.regions, data.w, data.h, x, y);
    if (label < 0) return;
    const prev = colors[label];
    const next = current === ERASER ? undefined : current;
    if (prev === next) return;
    undoStack.push({ label, prev, next });
    if (undoStack.length > 60) undoStack.shift();
    redoStack = [];
    setRegion(label, next);
  };

  // 手势：一指拖动、两指缩放、轻点填色；电脑上可用滚轮缩放
  const pts = new Map();
  let gest = null;
  const local = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, local(e));
    if (pts.size === 1) gest = { type: 'one', start: local(e), v0: { ...view }, moved: false, multi: false };
    else if (pts.size === 2 && data) {
      const [a, b] = [...pts.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const g = geom();
      gest = { type: 'two', dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, v0: { ...view }, p: { x: (mid.x - g.ox - view.tx) / (g.fit * view.scale), y: (mid.y - g.oy - view.ty) / (g.fit * view.scale) }, multi: true };
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId) || !gest || !data) return;
    pts.set(e.pointerId, local(e));
    if (gest.type === 'two' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const g = geom();
      const scale = Math.min(MAX, Math.max(1, gest.v0.scale * (Math.hypot(a.x - b.x, a.y - b.y) / gest.dist)));
      view = clamp({ scale, tx: mid.x - g.ox - g.fit * scale * gest.p.x, ty: mid.y - g.oy - g.fit * scale * gest.p.y });
      draw();
    } else if (gest.type === 'one') {
      const p = local(e);
      const dx = p.x - gest.start.x, dy = p.y - gest.start.y;
      if (!gest.moved && Math.hypot(dx, dy) > 8) gest.moved = true;
      if (gest.moved) { view = clamp({ scale: view.scale, tx: gest.v0.tx + dx, ty: gest.v0.ty + dy }); draw(); }
    }
  });
  const end = (e) => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if (gest && gest.type === 'one' && !gest.moved && !gest.multi && e.type === 'pointerup') paintAt(p.x, p.y);
    if (pts.size === 1) {
      const [q] = [...pts.values()];
      gest = { type: 'one', start: q, v0: { ...view }, moved: true, multi: true };
    } else if (pts.size === 0) gest = null;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => {
    if (!data) return;
    e.preventDefault();
    const m = local(e), g = geom();
    const p = { x: (m.x - g.ox - view.tx) / (g.fit * view.scale), y: (m.y - g.oy - view.ty) / (g.fit * view.scale) };
    const scale = Math.min(MAX, Math.max(1, view.scale * Math.exp(-e.deltaY * 0.002)));
    view = clamp({ scale, tx: m.x - g.ox - g.fit * scale * p.x, ty: m.y - g.oy - g.fit * scale * p.y });
    draw();
  }, { passive: false });

  $('#zoomBtn', v).addEventListener('click', () => { view = { scale: 1, tx: 0, ty: 0 }; draw(); });
  $('#sw', v).addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (b) { current = b.dataset.c; updatePalette(); } });
  $('#eraser', v).addEventListener('click', () => { current = ERASER; updatePalette(); });
  $('#eUndo', v).addEventListener('click', () => { const s = undoStack.pop(); if (s) { redoStack.push(s); setRegion(s.label, s.prev); } });
  $('#eRedo', v).addEventListener('click', () => { const s = redoStack.pop(); if (s) { undoStack.push(s); setRegion(s.label, s.next); } });

  const save = async () => {
    if (!data || !dirty) return;
    dirty = false;
    const rgba = compose(data.alpha, data.regions, colors, data.w, data.h);
    const blob = await toBlob(rgbaCanvas(rgba, data.w, data.h));
    if (rec.previewUrl) URL.revokeObjectURL(rec.previewUrl);
    rec.previewUrl = null;
    rec.preview = blob;
    rec.colors = colors;
    rec.progress = coloredRatio(data.regions, colors);
    withUrl(rec);
    Store.put(rec);
  };
  $('#eBack', v).addEventListener('click', () => go(from === 'record' ? 'record' : from, { id: rec.id }));
  $('#eDone', v).addEventListener('click', () => { go('record', { id: rec.id }); toast('已保存'); });

  const ro = new ResizeObserver(resize);
  ro.observe(stage);
  cleanup = () => { ro.disconnect(); save(); };

  updatePalette();
  updateProgress();
  (async () => {
    await wait(40);
    try {
      const m = await lineFromBlob(rec.line);
      data = { ...m, regions: buildRegions(m.ink, m.w, m.h) };
      resize();
      recompose();
    } catch (e) { toast('打开失败：' + (e.message || e)); }
    const b = $('#ebusy', v); if (b) b.hidden = true;
  })();
}

// ---------------- 上色列表 ----------------
function viewColor(v) {
  const list = [...records].sort((a, b) => (a.progress >= 0.9) - (b.progress >= 0.9) || b.createdAt - a.createdAt);
  const todo = records.filter((r) => r.progress < 0.9).length;
  v.innerHTML = `
    <div class="head pad"><h1 class="h1">上色</h1><p class="sub">${records.length ? `还有 ${todo} 张等你涂色` : '先去拍一张照片吧'}</p></div>
    ${records.length ? `<div class="scroll pad"><div class="grid2">
      ${list.map((r) => `<button type="button" class="tile" data-id="${r.id}" aria-label="给 ${fmtDate(r.createdAt)} 的线稿上色">
        <img src="${r.previewUrl}" alt="">
        <span class="meta"><span class="d">${fmtDate(r.createdAt)}</span>
        <span class="p"><span class="progress"><i style="width:${Math.round(r.progress * 100)}%"></i></span>${r.progress >= 0.9 ? '已完成' : Math.round(r.progress * 100) + '%'}</span></span>
      </button>`).join('')}
    </div></div>` : `<div class="empty">${icon('palette')}<span>拍下的照片会变成线稿，出现在这里等你涂色。</span><button type="button" class="btn" data-cam style="padding:0 28px">去拍照</button></div>`}`;
  v.querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', () => go('editor', { id: b.dataset.id, from: 'color' })));
  const c = $('[data-cam]', v); if (c) c.addEventListener('click', () => go('camera'));
}

// ---------------- 历史 ----------------
const histState = { mode: 'timeline', month: null, day: dayKey(Date.now()) };
function cardHtml(r) {
  const done = r.progress >= 0.9;
  return `<div class="card" role="button" tabindex="0" data-open="${r.id}">
    <img src="${r.previewUrl}" alt="">
    <div class="body">
      <span class="date">${fmtDate(r.createdAt)} · ${fmtTime(r.createdAt)}</span>
      <span class="note ${r.note ? '' : 'none'}">${r.note ? esc(r.note) : '没有写文字'}</span>
      <span class="foot">${badge(r.progress)}${done ? '' : `<button type="button" class="go" data-color="${r.id}" style="border:0;background:none;min-height:32px">${r.progress > 0 ? '继续 →' : '去上色 →'}</button>`}</span>
    </div>
  </div>`;
}
function bindCards(root) {
  root.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); go('editor', { id: b.dataset.color, from: 'history' }); }));
  root.querySelectorAll('[data-open]').forEach((b) => {
    b.addEventListener('click', () => go('record', { id: b.dataset.open }));
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') go('record', { id: b.dataset.open }); });
  });
}
function viewHistory(v) {
  const now = new Date();
  if (!histState.month) histState.month = { y: now.getFullYear(), m: now.getMonth() };
  const monthCount = records.filter((r) => { const d = new Date(r.createdAt); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }).length;
  const byDay = new Map();
  records.forEach((r) => { const k = dayKey(r.createdAt); byDay.set(k, [...(byDay.get(k) || []), r]); });
  let body = '';
  if (!records.length) {
    body = `<div class="empty">${icon('book')}<span>还没有记录。拍一张照片，写下当时的感受，它就会出现在这里。</span><button type="button" class="btn" data-cam style="padding:0 28px">去拍照</button></div>`;
  } else if (histState.mode === 'timeline') {
    body = `<div class="scroll pad"><div class="list">${records.map(cardHtml).join('')}</div></div>`;
  } else {
    const { y, m } = histState.month;
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const cells = Array(offset).fill(null);
    for (let d = 1; d <= days; d++) cells.push(d);
    while (cells.length % 7) cells.push(null);
    const today = dayKey(Date.now());
    const sel = byDay.get(histState.day) || [];
    const [, sm, sd] = histState.day.split('-');
    body = `<div class="scroll pad">
      <div class="cal-head"><button type="button" class="icon-btn" data-mon="-1" aria-label="上个月">${icon('back')}</button><h2>${y} 年 ${m + 1} 月</h2><button type="button" class="icon-btn" data-mon="1" aria-label="下个月">${icon('fwd')}</button></div>
      <div class="week">${'一二三四五六日'.split('').map((w) => `<span>${w}</span>`).join('')}</div>
      <div class="week">${cells.map((d) => {
        if (!d) return '<span></span>';
        const k = `${y}-${m + 1}-${d}`;
        const rs = byDay.get(k);
        return `<button type="button" class="day ${rs ? 'has' : ''} ${k === today ? 'today' : ''} ${k === histState.day ? 'sel' : ''}" data-day="${k}" aria-label="${m + 1}月${d}日${rs ? `，${rs.length} 条记录` : ''}">${rs ? `<img src="${rs[0].previewUrl}" alt="">` : ''}<b>${d}</b></button>`;
      }).join('')}</div>
      <p style="font-weight:800;margin:18px 0 0">${sm}月${sd}日 · ${sel.length ? `${sel.length} 条` : '这天没有记录'}</p>
      <div class="list">${sel.map(cardHtml).join('')}</div>
    </div>`;
  }
  v.innerHTML = `
    <div class="head pad">
      <h1 class="h1">我的记录</h1>
      <p class="sub">${now.getFullYear()} 年 ${now.getMonth() + 1} 月 · 本月 ${monthCount} 条记录</p>
      <div class="tabs2" role="tablist" aria-label="查看方式">
        <button type="button" role="tab" data-mode="timeline" aria-selected="${histState.mode === 'timeline'}">时间轴</button>
        <button type="button" role="tab" data-mode="calendar" aria-selected="${histState.mode === 'calendar'}">日历</button>
      </div>
    </div>${body}`;
  v.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { histState.mode = b.dataset.mode; viewHistory(v); }));
  v.querySelectorAll('[data-mon]').forEach((b) => b.addEventListener('click', () => {
    const d = new Date(histState.month.y, histState.month.m + Number(b.dataset.mon), 1);
    histState.month = { y: d.getFullYear(), m: d.getMonth() };
    viewHistory(v);
  }));
  v.querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => { histState.day = b.dataset.day; viewHistory(v); }));
  const c = $('[data-cam]', v); if (c) c.addEventListener('click', () => go('camera'));
  bindCards(v);
}

// ---------------- 单条记录 ----------------
function viewRecord(v) {
  const rec = findRec(state.params.id);
  if (!rec) { go('history'); return; }
  v.innerHTML = `
    <div class="bar pad">
      <button type="button" class="icon-btn" id="rBack" aria-label="返回">${icon('back')}</button>
      <h1 class="title">${fmtDate(rec.createdAt)}</h1>
      <span style="width:44px"></span>
    </div>
    <div class="scroll pad"><div class="stack">
      <img class="detail-img" src="${rec.previewUrl}" alt="作品">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-size:13px;color:var(--muted)">${fmtTime(rec.createdAt)}</span>${badge(rec.progress)}
      </div>
      <label class="field" for="rNote" style="margin:4px 0 0">当时的感受</label>
      <textarea id="rNote" maxlength="200" placeholder="补写一点当时的心情……">${esc(rec.note)}</textarea>
      <button type="button" class="btn" id="rColor">${icon('palette', 'sm')}${rec.progress > 0 ? '继续上色' : '开始上色'}</button>
      <button type="button" class="btn outline" id="rSave">${icon('save', 'sm')}保存到相册</button>
      <button type="button" class="btn outline" id="rDel">删除这条记录</button>
    </div></div>`;
  const note = $('#rNote', v);
  const saveNote = () => { if (note.value.trim() !== rec.note) { rec.note = note.value.trim(); Store.put(rec); } };
  note.addEventListener('change', saveNote);
  cleanup = saveNote;
  $('#rBack', v).addEventListener('click', () => go('history'));
  $('#rColor', v).addEventListener('click', () => go('editor', { id: rec.id, from: 'record' }));
  $('#rSave', v).addEventListener('click', async () => {
    const dataUrl = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(rec.preview); });
    // 安卓 App 里直接存进系统相册
    if (window.AndroidBridge && window.AndroidBridge.saveImage) {
      window.AndroidBridge.saveImage(dataUrl);
      return;
    }
    openOverlay(`<h2>保存到相册</h2><p>在 iPhone 上<b>长按下面的图片</b>，选择「存储到照片」。电脑上右键「图片存储为」。</p><img class="save-img" src="${dataUrl}" alt="作品"><button type="button" class="btn outline" data-close>关闭</button>`);
  });
  $('#rDel', v).addEventListener('click', () => {
    openOverlay(`<h2>删除这条记录？</h2><p>线稿、涂色和文字都会删除，无法恢复。</p><button type="button" class="btn danger" id="okDel">删除</button><button type="button" class="btn outline" data-close>取消</button>`);
    $('#okDel').addEventListener('click', () => {
      records = records.filter((r) => r !== rec);
      Store.del(rec.id);
      closeOverlay();
      cleanup = null;
      go('history');
      toast('已删除');
    });
  });
}

// ---------------- 账户 ----------------
function viewAccount(v) {
  const s = Settings.data;
  const days = new Set(records.map((r) => dayKey(r.createdAt)));
  let streak = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  const seg = (name, opts, val) => `<div class="seg" role="group" data-set="${name}">${opts.map(([id, l]) => `<button type="button" data-v="${id}" aria-pressed="${id === val}">${l}</button>`).join('')}</div>`;
  v.innerHTML = `
    <div class="scroll pad" style="padding-bottom:24px">
      <div class="head" style="padding-inline:0"><h1 class="h1">账户</h1></div>
      <div class="profile" style="margin-top:10px">
        <div class="avatar" id="av">${esc((s.nickname || '我').slice(0, 1))}</div>
        <div style="flex:1;min-width:0">
          <label for="nick" class="vh">昵称</label>
          <input id="nick" maxlength="16" placeholder="点这里填写昵称" value="${esc(s.nickname)}">
          <div style="font-size:13px;color:var(--muted)">用线条记录每一天</div>
        </div>
        ${icon('edit')}
      </div>
      <div class="stats" style="margin-top:14px">
        <div style="background:var(--tint-orange)"><b>${records.length}</b><span>条记录</span></div>
        <div style="background:var(--tint-green)"><b>${records.filter((r) => r.progress >= 0.9).length}</b><span>张已上色</span></div>
        <div style="background:var(--tint-blue)"><b>${streak}</b><span>天连续记录</span></div>
      </div>
      <h2 class="group-title">创作</h2>
      <div class="group">
        <div class="item"><span>线稿清晰度</span><small>高清线条更细腻，但生成会慢一些</small>${seg('quality', [['standard', '标准'], ['high', '高清']], s.quality)}</div>
      </div>
      <h2 class="group-title">数据</h2>
      <div class="group">
        <div class="item inline"><span>存储位置</span><span style="color:var(--muted);font-size:14px">只在这台设备的浏览器里</span></div>
        <div class="item inline"><button type="button" class="link-danger" id="clear">清空所有记录</button></div>
      </div>
      <h2 class="group-title">添加到主屏幕</h2>
      <div class="group"><div class="item"><span style="line-height:1.6;font-size:14px;color:var(--ink-soft)">在 iPhone 的 Safari 里点底部的「分享」按钮，选择「添加到主屏幕」，以后就能像 App 一样从桌面打开。</span></div></div>
      <h2 class="group-title">关于</h2>
      <div class="group"><div class="item inline"><span>线稿日记 · 网页测试版</span><span style="color:var(--muted);font-size:14px">1.0</span></div></div>
    </div>`;
  const nick = $('#nick', v);
  nick.addEventListener('change', () => { Settings.set({ nickname: nick.value.trim() }); $('#av', v).textContent = (nick.value.trim() || '我').slice(0, 1); });
  v.querySelectorAll('[data-set]').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    Settings.set({ [g.dataset.set]: b.dataset.v });
    g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  $('#clear', v).addEventListener('click', () => {
    openOverlay(`<h2>清空所有记录？</h2><p>所有线稿、涂色和文字都会从这台设备上删除，无法恢复。</p><button type="button" class="btn danger" id="okClear">全部清空</button><button type="button" class="btn outline" data-close>取消</button>`);
    $('#okClear').addEventListener('click', () => {
      records.forEach((r) => Store.del(r.id));
      records = [];
      closeOverlay();
      viewAccount(v);
      toast('已清空');
    });
  });
}

// ---------------- 弹层 ----------------
function openOverlay(html) {
  const o = $('#overlay');
  o.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`;
  o.hidden = false;
  o.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
}
function closeOverlay() { const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }
$('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeOverlay(); });

// ---------------- 安卓返回键 ----------------
// 安卓 App 按返回键时调用：返回 true 表示网页已经处理，false 表示退出 App
window.__appBack = () => {
  if (!$('#overlay').hidden) { closeOverlay(); return true; }
  const back = $('#view [data-back], #eBack, #rBack');
  if (back) { back.click(); return true; }
  if (state.view !== 'camera') { go('camera'); return true; }
  return false;
};

// ---------------- 启动 ----------------
(async () => {
  Settings.load();
  await Store.open();
  records = (await Store.all()).sort((a, b) => b.createdAt - a.createdAt).map(withUrl);
  let seeded = false;
  try { seeded = localStorage.getItem('xiangao-seeded') === '1'; } catch (e) { /* 忽略 */ }
  if (!records.length && !seeded) {
    await seedSample();
    try { localStorage.setItem('xiangao-seeded', '1'); } catch (e) { /* 忽略 */ }
  }
  render();
})();

</script>
